# Lint, test and check the Django project on pushes and pull requests.

name: Checks

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job id kept as check_format_and_imports: branch protection on master
  # requires a status check with this name.
  check_format_and_imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting with black
        run: black --check --diff .

      - name: Check import order with isort
        if: ${{ always() }}
        run: isort --check --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for missing migrations
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          DJANGO_DEBUG: "1"
        run: python manage.py test --verbosity 2

      - name: Check production settings
        env:
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SECURE_HSTS_SECONDS: "3600"
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "1"
          DJANGO_SECURE_HSTS_PRELOAD: "1"
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium

      - name: Start the app
        env:
          DJANGO_DEBUG: "1"
        run: |
          python manage.py migrate --no-input
          python manage.py runserver 127.0.0.1:8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: Run browser tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npm test --prefix e2e

      - name: Show server log
        if: ${{ failure() }}
        run: cat server.log
