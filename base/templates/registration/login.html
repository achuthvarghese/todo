{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do | Sign in</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'base/css/main.css' %}">
</head>

<body>
    <main id="main" class="auth">
        <div id="content">
            <h1>To Do</h1>
            <p>Sign in to manage your tasks</p>
            {% if form.errors %}
            <p class="text-danger" role="alert">Your username and password didn't match. Please try again.</p>
            {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Username</label>
                    <input type="text" class="form-control" name="{{ form.username.html_name }}"
                        id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}"
                        autocomplete="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                    <input type="password" class="form-control" name="{{ form.password.html_name }}"
                        id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary">Sign in</button>
            </form>
        </div>
    </main>
</body>

</html>
