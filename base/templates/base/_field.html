<div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <input class="input" type="{{ type|default:'text' }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"{% if type != "password" %} value="{{ field.value|default:'' }}"{% endif %}{% if autocomplete %} autocomplete="{{ autocomplete }}"{% endif %}{% if field.field.required %} required{% endif %}{% if field.field.max_length %} maxlength="{{ field.field.max_length }}"{% endif %}{% if autofocus %} autofocus{% endif %}{% if field.errors %} aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% elif field.help_text %} aria-describedby="{{ field.id_for_label }}-help"{% endif %}>
    {% if field.errors %}<div class="field__error" id="{{ field.id_for_label }}-error">{% for error in field.errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
    {% if field.help_text %}<div class="field__help" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</div>{% endif %}
</div>
