{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ page_title|default:"todo." }}</title>
    <meta name="description" content="{{ page_description|default:default_description }}">
    <meta name="robots" content="{% if noindex %}noindex, nofollow{% else %}index, follow{% endif %}">
    {% if not noindex %}<link rel="canonical" href="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">{% endif %}
    <meta name="theme-color" content="#FFD23F">
    <meta property="og:site_name" content="todo.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page_title|default:'todo.' }}">
    <meta property="og:description" content="{{ page_description|default:default_description }}">
    <meta property="og:url" content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="{% static 'base/img/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="{% static 'base/css/app.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
