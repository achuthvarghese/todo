{% extends "base/app.html" %}
{% load static %}
{% block page_class %} page--narrow{% endblock %}
{% block content %}
<h1 class="page-title">Get stuff <span class="highlight">done.</span></h1>

<div class="tiles" aria-label="Summary">
    <a class="tile" href="{% url 'base:stats' %}"><span class="tile__label">Open</span><span class="tile__value" data-tile="open">–</span></a>
    <a class="tile" href="{% url 'base:stats' %}"><span class="tile__label">Doing</span><span class="tile__value" data-tile="in_progress">–</span></a>
    <a class="tile" href="{% url 'base:stats' %}"><span class="tile__label">Done</span><span class="tile__value" data-tile="done">–</span></a>
</div>

<form class="add-form" id="add-form" novalidate>
    <label class="visually-hidden" for="new-task">New task</label>
    <input class="input" id="new-task" name="title" type="text" maxlength="60" placeholder="What needs doing?" autocomplete="off" aria-describedby="add-error">
    <button type="submit" class="btn btn--primary btn--lg">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        Add task
    </button>
</form>
<p class="form-error" id="add-error" role="alert" hidden></p>

<div class="toggles filters" role="group" aria-label="Filter tasks">
    <button type="button" class="toggle" data-filter="all" aria-pressed="true">All <span class="count" data-count="all">0</span></button>
    <button type="button" class="toggle" data-filter="pending" data-status="pending" aria-pressed="false">To do <span class="count" data-count="pending">0</span></button>
    <button type="button" class="toggle" data-filter="in_progress" data-status="in_progress" aria-pressed="false">Doing <span class="count" data-count="in_progress">0</span></button>
    <button type="button" class="toggle" data-filter="done" data-status="done" aria-pressed="false">Done <span class="count" data-count="done">0</span></button>
</div>

<p class="loading" id="loading">Loading tasks…</p>
<div class="empty" id="empty" hidden><strong></strong><p></p></div>
<ul class="task-list" id="task-list" aria-label="Tasks"></ul>
{% endblock %}
{% block scripts %}<script type="module" src="{% static 'base/js/tasks.js' %}"></script>{% endblock %}
