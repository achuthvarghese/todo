<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tasks — todo.</title>
    <meta name="description" content="todo. is a bold, simple task manager: list your tasks, move them across a board and see your progress in clear statistics.">
    <meta name="robots" content="noindex, nofollow">
    
    <meta name="theme-color" content="#FFD23F">
    <meta property="og:site_name" content="todo.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Tasks — todo.">
    <meta property="og:description" content="todo. is a bold, simple task manager: list your tasks, move them across a board and see your progress in clear statistics.">
    <meta property="og:url" content="https://achuthvarghese.github.io/todo/tasks/">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="/todo/static/base/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="/todo/static/base/css/app.css">
    
</head>
<body class="">
    <a class="skip-link" href="#main">Skip to content</a>
    
<header class="site-header">
    <div class="site-header__inner">
        <a class="brand" href="/todo/" aria-label="todo. home">
    <span class="brand__mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M3 8.5l3.2 3.2L13 4.5" fill="none" stroke="#0A0A0A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span aria-hidden="true">todo.</span>
</a>

        <nav class="main-nav" aria-label="Main">
            <a class="toggle" href="/todo/tasks/" aria-current="page">List</a>
            <a class="toggle" href="/todo/board/">Board</a>
            <a class="toggle" href="/todo/stats/">Stats</a>
        </nav>
        
        <details class="account">
            <summary aria-label="Demo menu">
                <span class="account__name">Demo</span>
                <span class="avatar" aria-hidden="true">D</span>
            </summary>
            <div class="account__menu">
                <p><strong>Demo mode.</strong> Your tasks are saved in this browser only.</p>
                <button type="button" class="btn btn--block" id="reset-demo">Reset sample data</button>
                <a class="btn btn--block" href="/todo/">About todo.</a>
            </div>
        </details>
        
    </div>
</header>

<main id="main" class="page page--narrow" data-mode="static"
      data-api-tasks="/todo/api/tasks/" data-api-stats="/todo/api/stats/">
    
<h1 class="page-title">Get stuff <span class="highlight">done.</span></h1>

<div class="tiles" aria-label="Summary">
    <a class="tile" href="/todo/stats/"><span class="tile__label">Open</span><span class="tile__value" data-tile="open">–</span></a>
    <a class="tile" href="/todo/stats/"><span class="tile__label">Doing</span><span class="tile__value" data-tile="in_progress">–</span></a>
    <a class="tile" href="/todo/stats/"><span class="tile__label">Done</span><span class="tile__value" data-tile="done">–</span></a>
</div>

<form class="add-form" id="add-form" novalidate>
    <label class="visually-hidden" for="new-task">New task</label>
    <input class="input" id="new-task" name="title" type="text" maxlength="60" placeholder="What needs doing?" autocomplete="off" aria-describedby="add-error">
    <button type="submit" class="btn btn--primary btn--lg">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        Add task
    </button>
</form>
<p class="form-error" id="add-error" role="alert" hidden></p>

<div class="toggles filters" role="group" aria-label="Filter tasks">
    <button type="button" class="toggle" data-filter="all" aria-pressed="true">All <span class="count" data-count="all">0</span></button>
    <button type="button" class="toggle" data-filter="pending" data-status="pending" aria-pressed="false">To do <span class="count" data-count="pending">0</span></button>
    <button type="button" class="toggle" data-filter="in_progress" data-status="in_progress" aria-pressed="false">Doing <span class="count" data-count="in_progress">0</span></button>
    <button type="button" class="toggle" data-filter="done" data-status="done" aria-pressed="false">Done <span class="count" data-count="done">0</span></button>
</div>

<p class="loading" id="loading">Loading tasks…</p>
<div class="empty" id="empty" hidden><strong></strong><p></p></div>
<ul class="task-list" id="task-list" aria-label="Tasks"></ul>

    <noscript><p class="empty"><strong>JavaScript is needed</strong>Turn on JavaScript to manage your tasks.</p></noscript>
</main>

<nav class="bottom-nav" aria-label="Main">
    <a href="/todo/tasks/" aria-current="page">
        <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h10" stroke="#0A0A0A" stroke-width="2" stroke-linecap="round"/></svg>List</a>
    <a href="/todo/board/">
        <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="3.2" height="10" rx="1" fill="none" stroke="#0A0A0A" stroke-width="1.8"/><rect x="6.4" y="3" width="3.2" height="7" rx="1" fill="none" stroke="#0A0A0A" stroke-width="1.8"/><rect x="10.8" y="3" width="3.2" height="5" rx="1" fill="none" stroke="#0A0A0A" stroke-width="1.8"/></svg>Board</a>
    <a href="/todo/stats/">
        <svg width="22" height="22" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13V8M8 13V3M13 13V6" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"/></svg>Stats</a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast__text"></span>
    <button type="button" class="btn" hidden></button>
</div>

    <script type="module" src="/todo/static/base/js/tasks.js"></script>
</body>
</html>
